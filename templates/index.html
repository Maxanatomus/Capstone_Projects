<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mood Recipe Recommender</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="{{ url_for('static', filename='js/main.js') }}"></script>
  </head>
  <body class="min-h-screen bg-gradient-to-br from-rose-100 via-white to-sky-100">
    <div class="max-w-3xl mx-auto px-4 py-16">
      <header class="text-center mb-10">
        <h1 class="text-4xl font-bold text-slate-800">Mood Recipe Recommender</h1>
        <p class="mt-4 text-slate-600">
          Pick your mood to discover a dish that matches the vibe. Not feeling it?
          Ask for another!
        </p>
      </header>

      <section class="bg-white/80 backdrop-blur rounded-xl shadow-lg p-8">
        <div class="flex flex-col gap-4 sm:flex-row sm:items-end">
          <label class="flex-1">
            <span class="block text-sm font-semibold text-slate-700 mb-2">Mood</span>
            <select
              id="mood-select"
              class="w-full rounded-lg border border-slate-200 bg-white px-4 py-2 text-slate-700 shadow-sm focus:outline-none focus:ring-2 focus:ring-sky-400"
            >
              <option value="" disabled selected>Select a mood</option>
            </select>
          </label>
          <button
            id="get-recipe"
            class="rounded-lg bg-sky-500 px-4 py-2 text-white font-semibold shadow hover:bg-sky-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-sky-400"
          >
            Find Recipe
          </button>
        </div>

        <div id="feedback" class="mt-4 text-sm text-rose-600 hidden"></div>

        <article id="recipe-card" class="mt-8 hidden">
          <h2 id="recipe-title" class="text-2xl font-bold text-slate-800"></h2>
          <p id="recipe-mood" class="text-sm uppercase tracking-wide text-slate-500 mt-1"></p>

          <div class="grid gap-6 mt-6 md:grid-cols-2">
            <section>
              <h3 class="text-lg font-semibold text-slate-700 mb-2">Ingredients</h3>
              <ul id="ingredient-list" class="list-disc list-inside space-y-1 text-slate-600"></ul>
            </section>
            <section>
              <h3 class="text-lg font-semibold text-slate-700 mb-2">Instructions</h3>
              <ol id="instruction-list" class="list-decimal list-inside space-y-1 text-slate-600"></ol>
            </section>
          </div>

          <div class="mt-8 flex flex-wrap gap-3">
            <button
              id="refresh-recipe"
              class="rounded-lg border border-sky-400 px-4 py-2 text-sky-600 font-semibold hover:bg-sky-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-sky-400"
            >
              Show Me Another
            </button>
          </div>
        </article>
      </section>

      <footer class="text-center mt-12 text-sm text-slate-500">
        Crafted with care using Flask, SQLite, and Tailwind CSS.
      </footer>
    </div>
  </body>
</html>
