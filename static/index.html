<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood Recipe Recommender</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .mood-btn {
            transition: all 0.3s ease;
        }
        .mood-btn:hover {
            transform: scale(1.05);
        }
        .mood-btn.selected {
            transform: scale(1.1);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-purple-100 to-pink-100 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <div class="text-center mb-8">
            <h1 class="text-5xl font-bold text-gray-800 mb-2">🍽️ Mood Recipe Recommender</h1>
            <p class="text-gray-600 text-lg">Select your mood and discover a perfect recipe!</p>
        </div>

        <!-- Mood Selection -->
        <div id="mood-selection" class="bg-white rounded-lg shadow-lg p-8 mb-6">
            <h2 class="text-2xl font-semibold text-gray-800 mb-6 text-center">How are you feeling today?</h2>
            <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                <button class="mood-btn bg-yellow-200 hover:bg-yellow-300 text-gray-800 font-semibold py-4 px-6 rounded-lg" data-mood="happy">
                    😊 Happy
                </button>
                <button class="mood-btn bg-blue-200 hover:bg-blue-300 text-gray-800 font-semibold py-4 px-6 rounded-lg" data-mood="sad">
                    😢 Sad
                </button>
                <button class="mood-btn bg-red-200 hover:bg-red-300 text-gray-800 font-semibold py-4 px-6 rounded-lg" data-mood="stressed">
                    😰 Stressed
                </button>
                <button class="mood-btn bg-green-200 hover:bg-green-300 text-gray-800 font-semibold py-4 px-6 rounded-lg" data-mood="energetic">
                    ⚡ Energetic
                </button>
                <button class="mood-btn bg-purple-200 hover:bg-purple-300 text-gray-800 font-semibold py-4 px-6 rounded-lg" data-mood="relaxed">
                    😌 Relaxed
                </button>
                <button class="mood-btn bg-orange-200 hover:bg-orange-300 text-gray-800 font-semibold py-4 px-6 rounded-lg" data-mood="excited">
                    🎉 Excited
                </button>
            </div>
        </div>

        <!-- Recipe Display -->
        <div id="recipe-display" class="hidden bg-white rounded-lg shadow-lg p-8">
            <div class="flex justify-between items-start mb-6">
                <h2 class="text-3xl font-bold text-gray-800" id="recipe-name"></h2>
                <button id="new-recipe-btn" class="bg-purple-500 hover:bg-purple-600 text-white font-semibold py-2 px-4 rounded-lg">
                    Get Another Recipe
                </button>
            </div>
            
            <p class="text-gray-600 text-lg mb-6" id="recipe-description"></p>
            
            <div class="grid md:grid-cols-2 gap-6">
                <div>
                    <h3 class="text-xl font-semibold text-gray-800 mb-3">📝 Ingredients</h3>
                    <ul class="list-disc list-inside text-gray-700 space-y-2" id="recipe-ingredients"></ul>
                </div>
                <div>
                    <h3 class="text-xl font-semibold text-gray-800 mb-3">👨‍🍳 Instructions</h3>
                    <p class="text-gray-700 whitespace-pre-line" id="recipe-instructions"></p>
                </div>
            </div>

            <div class="mt-6 text-center">
                <button id="back-btn" class="bg-gray-500 hover:bg-gray-600 text-white font-semibold py-2 px-6 rounded-lg">
                    ← Select Different Mood
                </button>
            </div>
        </div>

        <!-- Loading Spinner -->
        <div id="loading" class="hidden text-center py-8">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-purple-500"></div>
            <p class="mt-4 text-gray-600">Finding the perfect recipe...</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
